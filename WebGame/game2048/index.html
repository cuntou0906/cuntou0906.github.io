<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">2048</h1>
            <div class="score-container">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="score">0</div>
            </div>
        </header>

        <div class="game-info">
            <button class="new-game-btn" onclick="initGame()">New Game</button>
            <div class="best-score-container">
                <span class="best-score-label">BEST</span>
                <span class="best-score-value" id="bestScore">0</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Grid cells will be generated by JavaScript -->
        </div>

        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-content">
                <h2>Game Over!</h2>
                <p>Your score: <span id="finalScore">0</span></p>
                <button class="retry-btn" onclick="initGame()">Try Again</button>
            </div>
        </div>

        <div class="instructions">
            Use <strong>WASD</strong> or <strong>Arrow Keys</strong> to move tiles
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
